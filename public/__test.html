<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pint</title>
    <link rel="stylesheet" href="/style.css?v=1786479462" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/">pint</a>
      <form id="search-form" role="search">
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Search for anything…   (press / )"
          autocomplete="off"
          autofocus
        />
        <button type="submit">Search</button>
      </form>
      <p class="hints">
        <kbd>←</kbd><kbd>→</kbd> move · <kbd>Space</kbd> peek · <kbd>S</kbd> shelf ·
        <kbd>Esc</kbd> back
      </p>
    </header>

    <main>
      <p id="status" class="status" hidden></p>
      <div id="grid" class="grid"></div>
      <div id="sentinel"></div>
      <div id="loading" class="spinner" hidden></div>
      <button id="more" class="more" hidden>Load more</button>
    </main>

    <!-- The dig: layers stack over the frozen grid, never replacing it. -->
    <div id="backdrop" class="backdrop" hidden></div>
    <nav id="rail" class="rail" aria-label="Layer trail" hidden></nav>
    <div id="layers" class="layers"></div>

    <!-- Collected pins, kept across searches and reloads. -->
    <aside id="shelf" class="shelf empty">
      <span class="shelf-label">Shelf <b class="shelf-count">0</b></span>
      <div class="shelf-strip"></div>
      <button type="button" class="shelf-compare">Compare</button>
      <button type="button" class="shelf-clear" title="Clear the shelf">Clear</button>
    </aside>

    <div id="compare" class="compare" hidden>
      <header>
        <h2>Shelf</h2>
        <button type="button" class="compare-close" aria-label="Close">✕</button>
      </header>
      <div class="compare-grid"></div>
    </div>

    <script src="/app.js" type="module"></script>

    <img src="http://localhost:3999/slow?ms=15000" style="position:fixed;width:1px;height:1px;opacity:0" alt="" />
    <script>
      const log = (m) => fetch('http://localhost:3999/log?act=probe&msg=' + encodeURIComponent(m)).catch(()=>{});
      addEventListener('error', (e) => log('ERROR: ' + e.message));
      addEventListener('unhandledrejection', (e) => log('REJECTION: ' + (e.reason && e.reason.message || e.reason)));
    </script>
    <script type="module">
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const box = (el) => { const r = el.getBoundingClientRect(); return Math.round(r.width)+'x'+Math.round(r.height); };
      (async () => {
        for (let i=0;i<60 && !document.querySelector('#grid .card');i++) await wait(150);
        document.querySelector('#grid .card .card-open').click();
        for (let i=0;i<60 && !document.querySelector('.layer .sub-grid .card');i++) await wait(150);
        await wait(900);
        const layer = document.querySelector('.layer');
        const body = layer.querySelector('.layer-body');
        const hero = layer.querySelector('.layer-hero');
        const img = hero.querySelector('img');
        const cs = getComputedStyle(body), ch = getComputedStyle(hero), ci = getComputedStyle(img);
        log('layer ' + box(layer) + ' | body ' + box(body) + ' | hero ' + box(hero) + ' | img ' + box(img));
        log('body rows=' + cs.gridTemplateRows + ' overflow=' + cs.overflow + ' minH=' + cs.minHeight);
        log('hero height=' + ch.height + ' minH=' + ch.minHeight + ' display=' + ch.display);
        log('img maxH=' + ci.maxHeight + ' h=' + ci.height + ' aspect=' + ci.aspectRatio + ' objectFit=' + ci.objectFit);
        const rel = layer.querySelector('.layer-related');
        const sent = layer.querySelector('.layer-sentinel');
        log('related ' + box(rel) + ' scrollH=' + rel.scrollHeight + ' clientH=' + rel.clientHeight);
        const sr = sent.getBoundingClientRect(), lrr = layer.getBoundingClientRect();
        log('sentinel y=' + Math.round(sr.y) + ' layer bottom=' + Math.round(lrr.bottom) + ' inside=' + (sr.y < lrr.bottom));
        log('done');
      })();
    </script>
  </body>
</html>
