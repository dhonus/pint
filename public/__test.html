<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pint</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/">pint</a>
      <form id="search-form" role="search">
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Search for anything…   (press / )"
          autocomplete="off"
          autofocus
        />
        <button type="submit">Search</button>
      </form>
      <p class="hints">
        <kbd>Space</kbd> peek · <kbd>S</kbd> shelf · <kbd>Esc</kbd> back
      </p>
    </header>

    <main>
      <p id="status" class="status" hidden></p>
      <div id="grid" class="grid"></div>
      <div id="sentinel"></div>
      <button id="more" class="more" hidden>Load more</button>
    </main>

    <!-- The dig: layers stack over the frozen grid, never replacing it. -->
    <div id="backdrop" class="backdrop" hidden></div>
    <nav id="rail" class="rail" aria-label="Layer trail" hidden></nav>
    <div id="layers" class="layers"></div>

    <!-- Collected pins, kept across searches and reloads. -->
    <aside id="shelf" class="shelf empty">
      <span class="shelf-label">Shelf <b class="shelf-count">0</b></span>
      <div class="shelf-strip"></div>
      <button type="button" class="shelf-compare">Compare</button>
      <button type="button" class="shelf-clear" title="Clear the shelf">Clear</button>
    </aside>

    <div id="compare" class="compare" hidden>
      <header>
        <h2>Shelf</h2>
        <button type="button" class="compare-close" aria-label="Close">✕</button>
      </header>
      <div class="compare-grid"></div>
    </div>

    <script src="/app.js" type="module"></script>

    <img src="http://localhost:3999/slow?ms=9000" style="position:fixed;width:1px;height:1px;opacity:0" alt="" />
    <div id="errbox" style="position:fixed;top:70px;left:0;right:0;z-index:999;background:#c00;color:#fff;font:13px monospace;padding:8px;white-space:pre-wrap"></div>
    <script>
      // Classic scripts run before module scripts, so grab the param
      // before app.js boot rewrites the URL via replaceState.
      window.__act = new URLSearchParams(location.search).get('act');
      const box = document.getElementById('errbox');
      const log = (m) => { box.textContent += m + '\n'; };
      addEventListener('error', (e) => log('ERROR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno));
      addEventListener('unhandledrejection', (e) => log('REJECTION: ' + (e.reason && e.reason.message || e.reason)));
      const origErr = console.error;
      console.error = (...a) => { log('console.error: ' + a.join(' ')); origErr(...a); };
    </script>
    <script type="module">
      import { shelf } from '/shelf.js';
      const act = window.__act;
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const key = (k, code) => dispatchEvent(new KeyboardEvent('keydown', { key: k, code: code || k, bubbles: true }));

      async function untilCards(n = 1, tries = 60) {
        for (let i = 0; i < tries; i++) {
          if (document.querySelectorAll('#grid .card').length >= n) return true;
          await wait(150);
        }
        return false;
      }

      (async () => {
        const ok = await untilCards(1);
        log('grid cards: ' + document.querySelectorAll('#grid .card').length + (ok ? '' : ' (TIMEOUT)'));
        if (act === 'layer' || act === 'deep') {
          document.querySelector('#grid .card .card-open').click();
          await wait(2500);
          log('layers: ' + document.querySelectorAll('.layer').length + ' | sub cards: ' + document.querySelectorAll('.layer .sub-grid .card').length + ' | rail chips: ' + document.querySelectorAll('.rail-chip').length);
          if (act === 'deep') {
            for (let d = 0; d < 2; d++) {
              const sub = document.querySelector('.layer:last-child .sub-grid .card .card-open');
              if (sub) { sub.click(); await wait(2200); }
            }
            log('deep -> layers: ' + document.querySelectorAll('.layer').length + ' | rail: ' + document.querySelectorAll('.rail-chip').length + ' | url: ' + location.search.slice(0, 90));
          }
        }
        if (act === 'shelf') {
          const cards = [...document.querySelectorAll('#grid .card')].slice(0, 5);
          cards.forEach((c) => c.querySelector('.card-shelf').click());
          await wait(300);
          log('shelved: ' + shelf.count() + ' | strip items: ' + document.querySelectorAll('.shelf-strip .shelf-item').length);
          document.querySelector('.shelf-compare').click();
          await wait(600);
          log('compare open: ' + !document.getElementById('compare').hidden + ' | compare items: ' + document.querySelectorAll('.compare-item').length);
        }
        if (act === 'peek') {
          const card = document.querySelector('#grid .card');
          card.dispatchEvent(new PointerEvent('pointerenter', { bubbles: true }));
          await wait(100);
          key(' ', 'Space');
          await wait(900);
          log('peek visible: ' + !document.querySelector('.peek').hidden);
        }
        if (!box.textContent) log('no JS errors');
      })();
    </script>
  </body>
</html>
