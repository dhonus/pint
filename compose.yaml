services:
  pint:
    build: .
    container_name: pint
    restart: unless-stopped
    # Reaps zombies and forwards signals properly.
    init: true
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PINT_DATA: /data
    volumes:
      # Your saved shelves. The only state pint has.
      - pint-data:/data
    # Nothing else is ever written — the volume stays writable regardless.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pint-data:
